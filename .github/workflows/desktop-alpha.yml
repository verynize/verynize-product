name: Desktop alpha

on:
  workflow_dispatch:
  push:
    tags: ["desktop-v*-alpha.*"]
  pull_request:
    branches: [staging, main]
    paths:
      - ".github/workflows/desktop-alpha.yml"
      - "desktop/**"
      - "web/**"
      - "integrations/**"
      - "scripts/package-macos.cjs"
      - "scripts/desktop-release.mjs"
      - "scripts/build-*.cjs"
      - "scripts/build-*.mjs"
      - "tests/package-smoke.cjs"
      - "tests/desktop-release.mjs"
      - "tests/helpers/**"
      - "package*.json"
      - "vite.renderer.config.ts"

permissions:
  contents: read

concurrency:
  group: desktop-alpha-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
      - name: Confirm native architecture
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: node -e 'if (process.arch !== process.env.EXPECTED_ARCH) throw new Error("Runner architecture mismatch")'
      - name: Validate release tag
        if: github.event_name == 'push'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/desktop-release.mjs --validate-tag "$RELEASE_TAG"
      - run: npm ci
      - name: Download Electron
        # GitHub release downloads sometimes answer 504; retry with a growing pause.
        shell: bash
        run: |
          for attempt in 1 2 3 4 5; do
            node node_modules/electron/install.js && exit 0
            echo "Electron download failed (attempt $attempt), retrying in $((attempt * 20))s"
            sleep $((attempt * 20))
          done
          exit 1
      - run: node --test tests/desktop-release.mjs
      - name: Build app from source
        run: npm run package:mac
      - name: Check built assets
        run: npm run check
      - name: Archive and checksum
        run: node scripts/desktop-release.mjs
      - name: Extract the downloadable archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/desktop-download"
          /usr/bin/ditto -x -k dist/releases/*.zip "$RUNNER_TEMP/desktop-download"
          /usr/bin/codesign --verify --deep --strict "$RUNNER_TEMP/desktop-download/Verynize.app"
      - name: Smoke test downloaded app
        env:
          VERYNIZE_PACKAGED_APP: ${{ runner.temp }}/desktop-download/Verynize.app
          VERYNIZE_BLOCK_PRODUCTION_CLOUD: "1"
        run: node tests/package-smoke.cjs
      - name: Retain tested download
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-alpha-${{ matrix.arch }}
          path: dist/releases/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    name: Publish alpha prerelease
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/desktop-v') && github.repository == 'verynize/verynize-product'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: desktop-alpha-*
          path: release-assets
          merge-multiple: true
      - name: Verify release assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/desktop-release.mjs --validate-tag "$RELEASE_TAG"
          version=$(node -p 'require("./package.json").version')
          cd release-assets
          for arch in arm64 x64; do
            test -f "Verynize-${version}-macos-${arch}.zip.json"
            sha256sum --check "Verynize-${version}-macos-${arch}.zip.sha256"
          done
      - name: Publish only after both architectures pass
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/desktop-notes.md" <<'NOTES'
          Verynize desktop ALPHA for macOS. Choose arm64 for Apple silicon or x64 for Intel.

          Unzip and move Verynize.app to Applications. This alpha is ad-hoc signed and is not Apple-notarized; macOS may block the first launch. Review the source and checksum before using Privacy & Security > Open Anyway if offered by macOS. No automatic updates: download and replace the app manually.

          This is an early alpha. Keep backups of important designs, and do not rely on cloud edits made offline surviving a reload. The release gate covers packaged launch, editing and native save/reopen; it does not certify every feature or production service.

          Each ZIP has a SHA-256 checksum and JSON metadata with its source commit and architecture.
          NOTES
          if gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' > "$RUNNER_TEMP/release-draft"; then
            if [ "$(cat "$RUNNER_TEMP/release-draft")" != true ]; then
              echo 'Refusing to replace an already published release. Push a new alpha tag.' >&2
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --prerelease --latest=false --title "Verynize $RELEASE_TAG" --notes-file "$RUNNER_TEMP/desktop-notes.md"
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false --notes-file "$RUNNER_TEMP/desktop-notes.md"
